name: auto-assign-reviewer
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Pedir revisão ao par
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "${AUTOR,,}" in
            lelafeta)        PAR=osamuelleite ;;
            osamuelleite)    PAR=Lelafeta ;;
            cauarveloso)     PAR=pedrolmelo ;;
            pedrolmelo)      PAR=CauaRVeloso ;;
            arthurfeitosa05) PAR=Gustavormq ;;
            gustavormq)      PAR=ArthurFeitosa05 ;;
            *) exit 0 ;;
          esac
          gh api -X POST "repos/${{ github.repository }}/pulls/$PR/requested_reviewers" \
            -f "reviewers[]=$PAR"
